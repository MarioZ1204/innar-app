<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor PDF — Innar</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="/innar-buttons.css">
  <link rel="stylesheet" href="/soportes-pdf-editor.css">
  <link rel="stylesheet" href="/visor-pdf-page.css">
</head>
<body class="visor-pdf-standalone">
  <header class="visor-pdf-topbar">
    <h1 id="visorPdfPageTitle">Visor PDF</h1>
    <div class="visor-pdf-topbar-actions">
      <span id="visorPdfTopCount" class="visor-pdf-pending-count" aria-live="polite"></span>
      <button type="button" id="sopPdfEdSave" class="sop-btn sop-btn-primary visor-pdf-save-top" disabled hidden>Guardar en PDF</button>
    </div>
  </header>
  <main class="visor-pdf-main">
    <div id="visorPdfMount"></div>
  </main>
  <script src="/soportes-pdf-editor.js"></script>
  <script src="/visor-pdf-page.js"></script>
</body>
</html>
