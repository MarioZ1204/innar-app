<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Socket.IO Diagnostics</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #00ff00; }
    .log { border: 1px solid #444; padding: 10px; margin: 10px 0; background: #0d0d0d; max-height: 400px; overflow-y: auto; }
    .error { color: #ff4444; }
    .success { color: #44ff44; }
    .info { color: #4488ff; }
  </style>
</head>
<body>
  <h1>Socket.IO Diagnostics</h1>
  
  <h3>Información del servidor:</h3>
  <div id="serverInfo"></div>
  <div class="info" style="margin:12px 0;padding:8px;background:#322;border:1px solid #664">
      <strong>Importante:</strong> en producci&oacute;n Socket.IO solo acepta conexiones si hay sesi&oacute;n (has iniciado sesi&oacute;n en esta misma pesta&ntilde;a). Sin login ver&aacute;s error de conexi&oacute;n (<code>connect_error</code>).
    </div>
  <div id="log" class="log"></div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const log = document.getElementById('log');
    const serverInfo = document.getElementById('serverInfo');
    
    function addLog(msg, type = 'info') {
      const line = document.createElement('div');
      line.className = type;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }
    
    // Información del servidor
    fetch('/api/version')
      .then(r => r.json())
      .then(data => {
        serverInfo.innerHTML = `<div class="info">Version: ${data.version}</div>`;
      })
      .catch(e => {
        serverInfo.innerHTML = `<div class="error">Error obteniendo versión: ${e.message}</div>`;
      });
    
    fetch('/api/sesion', { credentials: 'include' })
      .then(r => r.json())
      .then(s => {
        if (!s.autenticado) {
          addLog('Estado sesión: NO autenticado. Primero entra desde / e inicia sesión; luego vuelve a esta página.', 'error');
          return;
        }
        addLog('Estado sesión: autenticado como ' + (s.usuario && s.usuario.usuario ? s.usuario.usuario : 'ok'), 'success');

        connectSocketProbe();
      })
      .catch(e => addLog('/api/sesion error: ' + e.message, 'error'));

    function connectSocketProbe() {
    // Esperamos a que Socket.IO se cargue globalmente
    setTimeout(() => {
      if (typeof io === 'undefined') {
        addLog('ERROR: io no definido. ¿socket.io.js no se cargó?', 'error');
        return;
      }
      
      addLog('✓ Socket.IO client script cargado', 'success');
      addLog('Conectando con opciones: polling + websocket (Hosting compartido)', 'info');
      
      const socket = io({
        reconnection: true,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
        reconnectionAttempts: 5,
        transports: ['polling', 'websocket'],
        upgrade: true,
        path: '/socket.io/',
        withCredentials: true,
        forceNew: false,
        autoConnect: true
      });
      
      socket.on('connect', () => {
        addLog('✓ CONEXIÓN EXITOSA', 'success');
        addLog('Socket ID: ' + socket.id, 'success');
        addLog('Transport: ' + socket.io.engine.transport.name, 'success');
      });
      
      socket.on('connect_error', (error) => {
        addLog('ERROR de conexión: ' + (error?.message || error), 'error');
      });
      
      socket.on('disconnect', (reason) => {
        addLog('Desconectado: ' + reason, 'error');
      });
      
      socket.on('sistema:version', (data) => {
        addLog('Servidor app version: ' + data.version, 'info');
      });
      
      // Intentamos conectar
      addLog('Llamando socket.connect()...');
      socket.connect();
    }, 500);
    }
  </script>
</body>
</html>
